<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ciclo</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#23281B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ciclo">

<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/appletouchicon.png">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app"></div>

<!--
  Ein einziges <script type="module">: alle anderen JS-Dateien werden über
  die import-Kette in js/10-app-init.js (und den von dort importierten
  Dateien) automatisch nachgeladen. Die Ladereihenfolge ergibt sich dadurch
  aus dem Abhängigkeitsgraphen der ES-Module (jede Datei läuft erst, NACHDEM
  alle ihre eigenen Imports fertig ausgewertet sind) statt aus der Reihen-
  folge von <script>-Tags — die frühere Nummerierung 01-storage.js …
  11-update.js ist rein organisatorisch, keine Lade-Reihenfolge-Vorschrift
  mehr. Kein Bundler nötig: Browser lösen ES-Module nativ auf, die App bleibt
  eine einfache Sammlung statischer Dateien ohne Build-Schritt.
-->
<script type="module" src="js/10-app-init.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((err) => {
      console.error('Service Worker Registrierung fehlgeschlagen:', err);
    });
  });
}
</script>
</body>
</html>
